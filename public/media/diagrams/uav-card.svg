<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t">
  <title id="t">UAV perception — aerial feed to occupancy count</title>
  <style>
    .h{font:600 30px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#16161D}
    .s{font:400 25px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#5B5B66}
    .m{font:600 22px ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#6366F1;letter-spacing:.16em}
    .big{font:300 96px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#16161D}
    .step{fill:#FFFFFF;stroke:#D9D5CE;stroke-width:2;rx:18}
    .stepa{fill:#EEF0FF;stroke:#6366F1;stroke-width:2;rx:18}
    .arw{stroke:#6366F1;stroke-width:3;fill:none;marker-end:url(#a)}
    .slot{fill:#FFFFFF;stroke:#C9C5BE;stroke-width:2;rx:6}
    .slotb{fill:#6366F1;rx:6}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/></marker></defs>
  <rect width="1200" height="750" fill="#FBFAF8"/>

  <text class="m" x="64" y="92">UAV PERCEPTION · NDC, NESCOM</text>
  <text class="h" x="64" y="150" style="font-size:40px">Boxes on a video are not the deliverable.</text>

  <g>
    <rect class="step" x="64" y="216" width="248" height="104"/>
    <text class="h" x="92" y="264">Aerial feed</text>
    <text class="s" x="92" y="298">moving camera</text>
    <path class="arw" d="M320 268 H356"/>

    <rect class="stepa" x="364" y="216" width="248" height="104"/>
    <text class="h" x="392" y="264">Detect</text>
    <text class="s" x="392" y="298">people, vehicles</text>
    <path class="arw" d="M620 268 H656"/>

    <rect class="stepa" x="664" y="216" width="248" height="104"/>
    <text class="h" x="692" y="264">Track</text>
    <text class="s" x="692" y="298">identity per frame</text>
    <path class="arw" d="M920 268 H956"/>

    <rect class="step" x="964" y="216" width="172" height="104"/>
    <text class="h" x="992" y="264">Count</text>
    <text class="s" x="992" y="298">occupancy</text>
  </g>

  <text class="big" x="64" y="500">18 / 24</text>
  <text class="h" x="64" y="546">Slots occupied — the number an operator acts on</text>

  <g>
    <rect class="slotb" x="640" y="404" width="70" height="44"/>
    <rect class="slotb" x="720" y="404" width="70" height="44"/>
    <rect class="slot"  x="800" y="404" width="70" height="44"/>
    <rect class="slotb" x="880" y="404" width="70" height="44"/>
    <rect class="slotb" x="960" y="404" width="70" height="44"/>
    <rect class="slot"  x="1040" y="404" width="70" height="44"/>
    <rect class="slotb" x="640" y="460" width="70" height="44"/>
    <rect class="slot"  x="720" y="460" width="70" height="44"/>
    <rect class="slotb" x="800" y="460" width="70" height="44"/>
    <rect class="slotb" x="880" y="460" width="70" height="44"/>
    <rect class="slotb" x="960" y="460" width="70" height="44"/>
    <rect class="slotb" x="1040" y="460" width="70" height="44"/>
  </g>

  <rect x="64" y="640" width="1072" height="3" fill="#E4E1DC"/>
  <text class="m" x="64" y="694" fill="#8B5CF6">DIAGRAM · NO PROGRAMME IMAGERY SHOWN</text>
</svg>
