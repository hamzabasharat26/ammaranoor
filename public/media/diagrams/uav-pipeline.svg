<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t d">
  <title id="t">UAV perception path</title>
  <desc id="d">A live aerial video feed from a moving camera is passed through YOLO detection for people and vehicles, then multi-object tracking holds identities across frames. The aggregated stream drives a dashboard showing live detections and parking slot occupancy.</desc>
  <style>
    .bg{fill:#FFFFFF}
    .card{fill:#FBFAF8;stroke:#E4E1DC;stroke-width:2;rx:14}
    .accent{fill:#EEF0FF;stroke:#6366F1;stroke-width:2;rx:14}
    .violet{fill:#F5F0FF;stroke:#8B5CF6;stroke-width:2;rx:14}
    .h{font:600 15px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#16161D}
    .s{font:400 13px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#5B5B66}
    .m{font:600 12px ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#6366F1;letter-spacing:.08em}
    .eyebrow{font:600 12px ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#8B5CF6;letter-spacing:.14em}
    .big{font:300 40px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#16161D}
    .flow{stroke:#6366F1;stroke-width:2;fill:none;marker-end:url(#ai)}
    .slot{fill:#FFFFFF;stroke:#C9C5BE;stroke-width:2;rx:5}
    .slotb{fill:#6366F1;rx:5}
  </style>
  <defs>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/></marker>
  </defs>

  <rect class="bg" width="1200" height="750"/>
  <text class="eyebrow" x="48" y="56">UAV PERCEPTION — NDC, NESCOM</text>
  <text class="h" x="48" y="86" style="font-size:22px">Boxes on a video are not the deliverable. A number is.</text>

  <rect class="card" x="48" y="132" width="248" height="128"/>
  <text class="m" x="72" y="168">INPUT</text>
  <text class="h" x="72" y="200">Live aerial feed</text>
  <text class="s" x="72" y="222">Moving camera, small targets,</text>
  <text class="s" x="72" y="240">ground scale changing with altitude</text>

  <path class="flow" d="M304 196 H348"/>

  <rect class="accent" x="356" y="132" width="248" height="128"/>
  <text class="m" x="380" y="168">DETECT</text>
  <text class="h" x="380" y="200">YOLO — people, vehicles</text>
  <text class="s" x="380" y="222">Per-frame detection over the</text>
  <text class="s" x="380" y="240">whole field of view</text>

  <path class="flow" d="M612 196 H656"/>

  <rect class="accent" x="664" y="132" width="248" height="128"/>
  <text class="m" x="688" y="168">TRACK</text>
  <text class="h" x="688" y="200">Identity across frames</text>
  <text class="s" x="688" y="222">One person crossing the scene</text>
  <text class="s" x="688" y="240">stays one person, not forty</text>

  <path class="flow" d="M920 196 H964"/>

  <rect class="violet" x="972" y="132" width="180" height="128"/>
  <text class="m" x="996" y="168" fill="#8B5CF6">AGGREGATE</text>
  <text class="h" x="996" y="200">Counts, not boxes</text>
  <text class="s" x="996" y="222">Occupancy derived</text>
  <text class="s" x="996" y="240">from the track set</text>

  <path class="flow" d="M1062 268 V312"/>

  <!-- dashboard mock -->
  <rect class="card" x="48" y="320" width="1104" height="284"/>
  <text class="m" x="72" y="356">OPERATOR DASHBOARD</text>
  <text class="s" x="72" y="380">What the raw detection stream becomes: live state an operator can act on.</text>

  <text class="big" x="72" y="452">18 / 24</text>
  <text class="h" x="72" y="478">Slots occupied</text>

  <text class="big" x="272" y="452">6</text>
  <text class="h" x="272" y="478">Free</text>

  <text class="big" x="392" y="452">31</text>
  <text class="h" x="392" y="478">People tracked</text>

  <g>
    <rect class="slotb" x="600" y="412" width="52" height="34"/>
    <rect class="slotb" x="662" y="412" width="52" height="34"/>
    <rect class="slot"  x="724" y="412" width="52" height="34"/>
    <rect class="slotb" x="786" y="412" width="52" height="34"/>
    <rect class="slotb" x="848" y="412" width="52" height="34"/>
    <rect class="slot"  x="910" y="412" width="52" height="34"/>
    <rect class="slotb" x="972" y="412" width="52" height="34"/>
    <rect class="slotb" x="1034" y="412" width="52" height="34"/>
    <rect class="slotb" x="600" y="456" width="52" height="34"/>
    <rect class="slot"  x="662" y="456" width="52" height="34"/>
    <rect class="slotb" x="724" y="456" width="52" height="34"/>
    <rect class="slotb" x="786" y="456" width="52" height="34"/>
    <rect class="slot"  x="848" y="456" width="52" height="34"/>
    <rect class="slotb" x="910" y="456" width="52" height="34"/>
    <rect class="slotb" x="972" y="456" width="52" height="34"/>
    <rect class="slotb" x="1034" y="456" width="52" height="34"/>
    <text class="s" x="600" y="516">Occupied</text>
    <rect class="slotb" x="672" y="504" width="16" height="14"/>
    <text class="s" x="712" y="516">Free</text>
    <rect class="slot" x="752" y="504" width="16" height="14"/>
    <text class="s" x="800" y="516">Slot layout is illustrative — the figures above are the shape of the output, not a measured result.</text>
  </g>

  <text class="s" x="72" y="560">An internship-length build: demonstrated on live feeds, not hardened into an unattended deployment. Detection holds over a limited altitude</text>
  <text class="s" x="72" y="582">band — as ground sample distance grows, a person stops being enough pixels to track reliably.</text>

  <text class="s" x="48" y="668">Defence-adjacent programme. No imagery from it is shown anywhere on this site, and this diagram carries no site, mission or performance detail —</text>
  <text class="s" x="48" y="690">it describes the perception path only, at the level the CV already states.</text>
</svg>
