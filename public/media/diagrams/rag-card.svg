<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t">
  <title id="t">Retrieval pipeline — ingest, chunk, embed, retrieve, generate</title>
  <style>
    .h{font:600 30px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#16161D}
    .s{font:400 25px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#5B5B66}
    .m{font:600 22px ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#6366F1;letter-spacing:.16em}
    .step{fill:#FFFFFF;stroke:#D9D5CE;stroke-width:2;rx:18}
    .stepa{fill:#EEF0FF;stroke:#6366F1;stroke-width:2;rx:18}
    .stepv{fill:#F5F0FF;stroke:#8B5CF6;stroke-width:2;rx:18}
    .arw{stroke:#6366F1;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/></marker></defs>
  <rect width="1200" height="750" fill="#FBFAF8"/>

  <text class="m" x="64" y="92">RAG IN PRODUCTION CLIENT APPS</text>
  <text class="h" x="64" y="150" style="font-size:40px">Get retrieval right first.</text>

  <g>
    <rect class="step" x="64" y="216" width="228" height="104"/>
    <text class="h" x="92" y="264">Ingest</text>
    <text class="s" x="92" y="298">messy client docs</text>
    <path class="arw" d="M300 268 H336"/>

    <rect class="stepa" x="344" y="216" width="228" height="104"/>
    <text class="h" x="372" y="264">Chunk</text>
    <text class="s" x="372" y="298">strategy rebuilt</text>
    <path class="arw" d="M580 268 H616"/>

    <rect class="step" x="624" y="216" width="228" height="104"/>
    <text class="h" x="652" y="264">Embed</text>
    <text class="s" x="652" y="298">vector per chunk</text>
    <path class="arw" d="M860 268 H896"/>

    <rect class="stepa" x="904" y="216" width="232" height="104"/>
    <text class="h" x="932" y="264">Retrieve</text>
    <text class="s" x="932" y="298">top-k, by meaning</text>
  </g>

  <g>
    <rect class="stepv" x="64" y="372" width="512" height="104"/>
    <text class="h" x="92" y="420">OCR + YOLOv8 branch</text>
    <text class="s" x="92" y="454">scans and images into the same path</text>

    <rect class="stepa" x="624" y="372" width="512" height="104"/>
    <text class="h" x="652" y="420">LLM answer → React dashboard</text>
    <text class="s" x="652" y="454">REST API, role-based auth, live updates</text>
  </g>

  <text class="s" x="64" y="556">Collapsed a multi-step manual review into one automated pipeline.</text>
  <text class="s" x="64" y="600">Chunking rebuilt after standard metrics failed to predict real failures.</text>
  <rect x="64" y="652" width="1072" height="3" fill="#E4E1DC"/>
  <text class="m" x="64" y="704" fill="#8B5CF6">DIAGRAM · CLIENT WORK, NO SCREENSHOTS SHOWN</text>
</svg>
