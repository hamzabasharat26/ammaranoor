<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t d">
  <title id="t">PatchCore results on MVTec AD carpet</title>
  <desc id="d">99.56 percent image AUROC. At the operating threshold 87 of 89 defects were caught and 26 of 28 good pieces passed, with precision, recall and F1 at 0.9775. Both misses were thread defects. CPU latency is 535 milliseconds per image against the 33 milliseconds a 30 FPS line requires.</desc>
  <style>
    .bg{fill:#FFFFFF}
    .card{fill:#FBFAF8;stroke:#E4E1DC;stroke-width:2;rx:14}
    .accent{fill:#EEF0FF;stroke:#6366F1;stroke-width:2;rx:14}
    .warm{fill:#FDF0F6;stroke:#EC4899;stroke-width:2;rx:14}
    .big{font:300 46px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#16161D}
    .h{font:600 15px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#16161D}
    .s{font:400 13px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#5B5B66}
    .m{font:600 12px ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#6366F1;letter-spacing:.08em}
    .eyebrow{font:600 12px ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#8B5CF6;letter-spacing:.14em}
    .num{font:600 14px ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#16161D}
    .rule{stroke:#E4E1DC;stroke-width:2}
  </style>

  <rect class="bg" width="1200" height="750"/>
  <text class="eyebrow" x="48" y="56">MVTEC AD · CARPET · CORESET 0.05 · 320PX · CPU</text>
  <text class="h" x="48" y="86" style="font-size:22px">Measured, with the misses named.</text>

  <!-- metric tiles -->
  <g>
    <rect class="accent" x="48" y="118" width="264" height="150"/>
    <text class="big" x="72" y="188">99.56%</text>
    <text class="h" x="72" y="216">Image AUROC</text>
    <text class="s" x="72" y="240">Coreset 0.05 at 320px input</text>

    <rect class="card" x="328" y="118" width="264" height="150"/>
    <text class="big" x="352" y="188">87 / 89</text>
    <text class="h" x="352" y="216">Defects caught</text>
    <text class="s" x="352" y="240">At the operating threshold</text>

    <rect class="card" x="608" y="118" width="264" height="150"/>
    <text class="big" x="632" y="188">26 / 28</text>
    <text class="h" x="632" y="216">Good pieces passed</text>
    <text class="s" x="632" y="240">Two false alarms</text>

    <rect class="card" x="888" y="118" width="264" height="150"/>
    <text class="big" x="912" y="188">0.9775</text>
    <text class="h" x="912" y="216">Precision · Recall · F1</text>
    <text class="s" x="912" y="240">All three, same value</text>
  </g>

  <!-- per defect type -->
  <rect class="card" x="48" y="298" width="544" height="290"/>
  <text class="m" x="72" y="334">CAUGHT, PER DEFECT TYPE</text>
  <g class="num">
    <text x="72" y="374">hole</text><text x="470" y="374">17 / 17</text>
    <text x="72" y="412">cut</text><text x="470" y="412">17 / 17</text>
    <text x="72" y="450">metal contamination</text><text x="470" y="450">17 / 17</text>
    <text x="72" y="488">colour</text><text x="470" y="488">19 / 19</text>
    <text x="72" y="526" fill="#BE185D">thread</text><text x="470" y="526" fill="#BE185D">17 / 19</text>
  </g>
  <line class="rule" x1="72" y1="352" x2="544" y2="352"/>
  <line class="rule" x1="72" y1="504" x2="544" y2="504"/>
  <text class="s" x="72" y="560">Both misses are thread defects — thin, low-contrast, barely</text>
  <text class="s" x="72" y="578">disturbing local patch statistics where a hole destroys them.</text>

  <!-- latency -->
  <rect class="warm" x="620" y="298" width="532" height="290"/>
  <text class="m" x="644" y="334" fill="#BE185D">THE GAP THAT IS NOT CLOSED</text>
  <text class="h" x="644" y="372">CPU inference</text>
  <rect x="644" y="386" width="484" height="26" rx="6" fill="#F7D6E6"/>
  <text class="num" x="654" y="404" fill="#9D174D">535 ms / image</text>
  <text class="h" x="644" y="450">What a 30 FPS line needs</text>
  <rect x="644" y="464" width="30" height="26" rx="6" fill="#6366F1"/>
  <text class="num" x="686" y="482">33 ms</text>
  <text class="s" x="644" y="524">Closing it needs ONNX export, quantisation and a GPU or edge</text>
  <text class="s" x="644" y="542">accelerator. That path is documented in the repo, not built —</text>
  <text class="s" x="644" y="560">which is why this is stated as a limitation, not a result.</text>

  <!-- footer -->
  <text class="s" x="48" y="642">Threshold set at the 95th percentile of normal scores (2.1189). Normal and defective score distributions overlap between 2.03 and 2.18,</text>
  <text class="s" x="48" y="664">so perfect separation is not available: the threshold is a cost decision. A missed defect reaches a customer; a false alarm costs an</text>
  <text class="s" x="48" y="686">operator thirty seconds of inspection.</text>
</svg>
