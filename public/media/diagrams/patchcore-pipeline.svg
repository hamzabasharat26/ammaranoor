<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t d">
  <title id="t">PatchCore pipeline</title>
  <desc id="d">Defect-free images pass through a frozen WideResNet-50, are pooled into patch features and reduced by greedy k-center coreset subsampling into a memory bank. At inference a new image is scored by each patch's distance to its nearest neighbour in that bank, producing an image score and a heatmap.</desc>
  <style>
    .bg{fill:#FFFFFF}
    .card{fill:#FBFAF8;stroke:#E4E1DC;stroke-width:2;rx:14}
    .accent{fill:#EEF0FF;stroke:#6366F1;stroke-width:2;rx:14}
    .warm{fill:#FDF0F6;stroke:#EC4899;stroke-width:2;rx:14}
    .h{font:600 15px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#16161D}
    .s{font:400 13px ui-sans-serif,system-ui,'Segoe UI',sans-serif;fill:#5B5B66}
    .m{font:600 12px ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#6366F1;letter-spacing:.08em}
    .eyebrow{font:600 12px ui-monospace,'Cascadia Mono',Consolas,monospace;fill:#8B5CF6;letter-spacing:.14em}
    .flow{stroke:#B9B5AE;stroke-width:2;fill:none;marker-end:url(#a)}
    .flowa{stroke:#6366F1;stroke-width:2;fill:none;marker-end:url(#ai)}
    .rule{stroke:#E4E1DC;stroke-width:2}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B9B5AE"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/></marker>
  </defs>

  <rect class="bg" width="1200" height="750"/>
  <text class="eyebrow" x="48" y="56">PATCHCORE — MEMORY BANK, NOT A TRAINED HEAD</text>
  <text class="h" x="48" y="86" style="font-size:22px">Fit once on normal images. Score by distance.</text>

  <!-- FIT ROW -->
  <text class="m" x="48" y="140">FIT</text>
  <g>
    <rect class="card" x="48" y="156" width="200" height="96"/>
    <text class="h" x="68" y="192">Defect-free images</text>
    <text class="s" x="68" y="214">Normal cloth only —</text>
    <text class="s" x="68" y="232">no defect labels needed</text>

    <path class="flow" d="M256 204 H300"/>

    <rect class="accent" x="308" y="156" width="212" height="96"/>
    <text class="h" x="328" y="192">Frozen WideResNet-50</text>
    <text class="s" x="328" y="214">layer2 + layer3 features —</text>
    <text class="s" x="328" y="232">mid-level, not ImageNet classes</text>

    <path class="flow" d="M528 204 H572"/>

    <rect class="card" x="580" y="156" width="196" height="96"/>
    <text class="h" x="600" y="192">3×3 patch pooling</text>
    <text class="s" x="600" y="214">Average against the</text>
    <text class="s" x="600" y="232">neighbourhood → shift tolerant</text>

    <path class="flow" d="M784 204 H828"/>

    <rect class="accent" x="836" y="156" width="316" height="96"/>
    <text class="h" x="856" y="192">Greedy k-center coreset → memory bank</text>
    <text class="s" x="856" y="214">Keeps 1-5% of patches. Random sampling would drop</text>
    <text class="s" x="856" y="232">the rare-but-normal ones — seams, printed markings.</text>
  </g>

  <line class="rule" x1="48" y1="308" x2="1152" y2="308"/>

  <!-- INFERENCE ROW -->
  <text class="m" x="48" y="356">INFERENCE</text>
  <g>
    <rect class="card" x="48" y="372" width="200" height="96"/>
    <text class="h" x="68" y="408">New image</text>
    <text class="s" x="68" y="430">Any piece off the line</text>

    <path class="flowa" d="M256 420 H300"/>

    <rect class="card" x="308" y="372" width="212" height="96"/>
    <text class="h" x="328" y="408">Same patch features</text>
    <text class="s" x="328" y="430">Identical frozen backbone</text>

    <path class="flowa" d="M528 420 H572"/>

    <rect class="accent" x="580" y="372" width="196" height="96"/>
    <text class="h" x="600" y="408">Nearest-neighbour</text>
    <text class="s" x="600" y="430">Distance to the bank = score</text>

    <path class="flowa" d="M784 420 H828"/>

    <rect class="warm" x="836" y="372" width="316" height="96"/>
    <text class="h" x="856" y="408">Image score + heatmap</text>
    <text class="s" x="856" y="430">Max over patches decides pass/flag; the upsampled</text>
    <text class="s" x="856" y="448">grid shows the operator where to look.</text>
  </g>

  <!-- FOOT -->
  <rect class="card" x="48" y="520" width="532" height="176"/>
  <text class="m" x="72" y="556">NOTHING IS TRAINED</text>
  <text class="s" x="72" y="586">The backbone is frozen and there is no loss function.</text>
  <text class="s" x="72" y="608">“Training” here means remembering what normal looks like,</text>
  <text class="s" x="72" y="630">so a defect type nobody has labelled yet is caught by</text>
  <text class="s" x="72" y="652">construction rather than by anticipation.</text>

  <rect class="card" x="620" y="520" width="532" height="176"/>
  <text class="m" x="644" y="556">THRESHOLD = 95TH PERCENTILE OF NORMAL</text>
  <text class="s" x="644" y="586">The rule you can actually apply in production, where only</text>
  <text class="s" x="644" y="608">normal data exists. The best-achievable F1 threshold needs</text>
  <text class="s" x="644" y="630">test labels, so it is reported as a reference bound —</text>
  <text class="s" x="644" y="652">not as a recommendation.</text>
</svg>
